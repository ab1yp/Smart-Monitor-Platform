@if (passwordUpdated) {
  <div class="flex min-h-[80vh] items-center justify-center">
    <div
      class="w-full max-w-md rounded-2xl border border-border bg-surface p-8 text-center shadow-sm"
    >
      <div
        class="mx-auto mb-6 flex h-16 w-16 items-center justify-center rounded-full bg-success/10"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-8 w-8 text-success"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
        </svg>
      </div>
      <h2 class="text-2xl font-bold text-text">Password Updated</h2>
      <p class="mt-3 text-sm leading-6 text-text-muted">
        Your password has been updated successfully. You can now sign in using your new password.
      </p>
      <button
        routerLink="/al/signin"
        class="mt-8 w-full rounded-lg bg-brand px-4 py-3 font-semibold text-background transition hover:bg-brand-hover"
      >
        Go to Sign In
      </button>
    </div>
  </div>
} @else {
  <div class="flex min-h-[80vh] items-center justify-center">
    <div class="w-full max-w-md rounded-2xl border border-border bg-surface p-8 shadow-sm">
      <div class="mb-8 text-center">
        <h2 class="text-2xl font-bold text-text">Update Password</h2>
        <p class="mt-2 text-sm text-text-muted">Enter your new password below.</p>
      </div>
      <form [formGroup]="formData" (ngSubmit)="submitForm()" class="space-y-6">
        <div>
          <label for="password" class="block text-sm font-medium text-text"> New Password </label>
          <div class="mt-2">
            <input
              id="password"
              type="password"
              formControlName="password"
              [disabled]="isLoading"
              autocomplete="new-password"
              placeholder="Enter your new password"
              class="block w-full rounded-md border border-border bg-background px-3 py-3 text-text placeholder:text-text-muted focus:border-brand focus:outline-none disabled:cursor-not-allowed disabled:opacity-60"
            />
          </div>
        </div>
        <div>
          <label for="confirmPassword" class="block text-sm font-medium text-text">
            Confirm Password
          </label>
          <div class="mt-2">
            <input
              id="confirmPassword"
              type="password"
              formControlName="confirmPassword"
              [disabled]="isLoading"
              autocomplete="new-password"
              placeholder="Confirm your new password"
              class="block w-full rounded-md border border-border bg-background px-3 py-3 text-text placeholder:text-text-muted focus:border-brand focus:outline-none disabled:cursor-not-allowed disabled:opacity-60"
            />
          </div>
        </div>
        <button
          type="submit"
          [disabled]="isLoading"
          class="flex w-full justify-center rounded-md bg-brand px-3 py-3 font-semibold text-background transition hover:bg-brand-hover disabled:cursor-not-allowed disabled:opacity-60"
        >
          @if (!isLoading) {
            Update Password
          } @else {
            Updating Password...
          }
        </button>
      </form>
    </div>
  </div>
}
