<div class="fixed inset-0 z-50 flex items-center justify-center bg-background">
  <div class="w-full max-w-md rounded-2xl border border-border bg-background shadow-2xl">
    <div class="border-b border-border p-6">
      <h2 class="text-xl font-semibold text-text">Create Device</h2>
    </div>
    <form [formGroup]="deviceForm" (ngSubmit)="createDevice()" class="space-y-5 p-6">
      <div>
        <label class="mb-2 block text-sm font-medium text-text"> Device Name </label>
        <input
          type="text"
          formControlName="name"
          placeholder="XX-XXX"
          class="w-full rounded-xl border border-border bg-surface px-4 py-3 outline-none transition focus:border-brand focus:ring-2 focus:ring-brand/20"
        />
        @if (deviceForm.get('name')?.invalid && deviceForm.get('name')?.touched) {
          <p class="mt-2 text-sm text-danger">Device name is required.</p>
        }
      </div>
      <div>
        <label class="mb-2 block text-sm font-medium text-text"> Description </label>
        <textarea
          rows="4"
          formControlName="description"
          placeholder="Describe your device..."
          class="w-full resize-none rounded-xl border border-border bg-surface px-4 py-3 outline-none transition focus:border-brand focus:ring-2 focus:ring-brand/20"
        >
        </textarea>
      </div>
      <div class="flex items-center justify-between pt-2">
        <button
          type="button"
          (click)="goBack()"
          class="rounded-xl border border-border px-5 py-2.5 transition hover:bg-surface-hover"
        >
          Back
        </button>
        <button
          type="submit"
          [disabled]="deviceForm.invalid || isSubmitting"
          class="rounded-xl bg-brand px-6 py-2.5 font-semibold text-background transition hover:bg-brand-hover disabled:cursor-not-allowed disabled:opacity-50"
        >
          @if (!isSubmitting) {
            Create Device
          } @else {
            Creating...
          }
        </button>
      </div>
    </form>
  </div>
</div>
