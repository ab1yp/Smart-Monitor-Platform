<section
  class="relative flex min-h-[80vh] w-full items-center justify-center overflow-hidden px-4 py-10 sm:px-6"
>
  <div class="absolute -right-24 -top-24 h-72 w-72 rounded-full bg-brand/10 blur-3xl"></div>
  <div class="absolute -bottom-24 -left-24 h-72 w-72 rounded-full bg-brand/5 blur-3xl"></div>
  <div class="relative w-full max-w-lg text-center">
    <div
      class="mb-6 inline-flex items-center gap-2 rounded-full border border-border bg-surface px-3.5 py-1.5 text-xs font-medium text-text-muted"
    >
      <span class="h-1.5 w-1.5 rounded-full bg-danger"></span>
      Error 404
    </div>
    <div class="relative">
      <h1
        class="select-none text-[112px] font-black leading-none tracking-tighter text-text sm:text-[144px]"
      >
        4<span class="text-brand">0</span>4
      </h1>
      <div
        class="pointer-events-none absolute left-1/2 top-1/2 h-24 w-24 -translate-x-1/2 -translate-y-1/2 rounded-full bg-brand/20 blur-3xl"
      ></div>
    </div>
    <h2 class="mt-4 text-2xl font-bold tracking-tight text-text sm:text-3xl">Page not found</h2>
    <p class="mx-auto mt-3 max-w-md text-sm leading-6 text-text-muted sm:text-base">
      The page you're looking for doesn't exist, was moved, or you don't have permission to view it.
    </p>
    <div class="mt-8 flex flex-col items-center justify-center gap-3 sm:flex-row">
      <button
        type="button"
        (click)="goBack()"
        class="inline-flex w-full items-center justify-center gap-2 rounded-lg border border-border bg-surface px-5 py-2.5 text-sm font-medium text-text transition hover:border-brand/30 hover:text-brand sm:w-auto"
      >
        <svg
          viewBox="0 0 24 24"
          class="h-4 w-4"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M19 12H5M12 19l-7-7 7-7" />
        </svg>
        Go back
      </button>
    </div>
  </div>
</section>
